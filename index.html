<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube Clone</title>
  
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/app.css" />

  <!-- Google Identity Services (GIS) Official SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Firebase App, Auth & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="app">
    <!-- Top App Bar -->
    <header class="top-app-bar" id="top-bar"></header>

    <!-- Main Content Area -->
    <main id="main-view"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav"></nav>

    <!-- Fullscreen Video Player Modal -->
    <div id="video-player-overlay" class="video-player-overlay"></div>

    <!-- Action Sheet / Bottom Sheet Modal -->
    <div id="bottom-sheet-backdrop" class="bottom-sheet-backdrop"></div>
    <div id="bottom-sheet" class="bottom-sheet"></div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-modal-overlay"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
