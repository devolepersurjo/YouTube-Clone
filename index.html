<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  
  <!-- ✅ Google Search Console Verification Meta Tag -->
  <meta name="google-site-verification" content="xO5JOBPwrVXkaXP1rzlt5wHh0aq3o5Ml_L6vqggTf8U" />

  <!-- 🔍 Google Search SEO Title & Description -->
  <title>YouTube Clone Premium - Watch Trending Videos & Shorts</title>
  <meta name="description" content="Watch trending videos, music, entertainment, and vertical shorts on YouTube Clone Premium. Create playlists, like, and stream seamlessly." />
  <meta name="keywords" content="YouTube Clone Premium, youtube clone, watch videos, shorts, trending videos, online video streaming" />
  <meta name="author" content="YouTube Clone Premium" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://youtube-clone-premium.vercel.app/" />

  <!-- 🖼️ Google Search Favicon / Logo -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" />

  <!-- 📱 Social Media Open Graph (Preview on Facebook, WhatsApp, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://youtube-clone-premium.vercel.app/" />
  <meta property="og:title" content="YouTube Clone Premium - Watch Trending Videos & Shorts" />
  <meta property="og:description" content="Stream high-quality videos, music, and vertical shorts with smart recommendations on YouTube Clone Premium." />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" />
  <meta property="og:site_name" content="YouTube Clone Premium" />

  <!-- 🤖 Google Structured Data (JSON-LD Schema for Google Search Rich Snippet) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "YouTube Clone Premium",
    "alternateName": "YouTube Clone",
    "url": "https://youtube-clone-premium.vercel.app/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://youtube-clone-premium.vercel.app/#search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Google Identity Services (GIS) Official SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Firebase App, Auth & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Top App Bar -->
    <header class="top-app-bar" id="top-bar"></header>

    <!-- Main Content Area -->
    <main id="main-view"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav"></nav>

    <!-- Fullscreen Video Player Modal -->
    <div id="video-player-overlay" class="video-player-overlay"></div>

    <!-- Action Sheet / Bottom Sheet Modal -->
    <div id="bottom-sheet-backdrop" class="bottom-sheet-backdrop"></div>
    <div id="bottom-sheet" class="bottom-sheet"></div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-modal-overlay"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
